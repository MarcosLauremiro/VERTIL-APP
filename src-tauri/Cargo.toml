[package]
name = "vertil-app"
version = "0.1.0"
description = "Vertil App: assistente, foco e wallpapers no topo da tela"
edition = "2021"

[lib]
# O sufixo _lib evita conflito de nome com o binário no Windows.
name = "vertil_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-opener = "2"
chrono = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
